name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: pip install twine && twine upload dist/*

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-e3cli
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate formula with all transitive dependencies
        run: |
          python3 - "${{ github.repository }}" "${{ github.ref_name }}" << 'PYSCRIPT'
          import json, re, sys, time, urllib.request

          repo, ref_name = sys.argv[1], sys.argv[2]
          e3cli_version = ref_name.lstrip("v")

          def get_info(pkg, version=None):
              """Fetch package info from PyPI. If version is given, look up that specific
              release's files; otherwise use the latest. Returns None if the version is
              not yet indexed or no installable file exists."""
              pkg_normalized = re.sub(r'[-_.]+', '-', pkg).lower()
              try:
                  data = json.loads(urllib.request.urlopen(f"https://pypi.org/pypi/{pkg_normalized}/json").read())
              except Exception:
                  return None
              ver = version or data["info"]["version"]
              requires = data["info"].get("requires_dist") or []
              deps = []
              for r in requires:
                  if "extra ==" in r:
                      continue
                  m = re.match(r'^([A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?)', r)
                  if m:
                      deps.append(m.group(1).lower())
              # Prefer pure-Python wheel (py3-none-any) → no compile, no build-isolation,
              # much faster brew install. Fall back to sdist if no universal wheel exists.
              wheel_url = wheel_sha = sdist_url = sdist_sha = ""
              for f in data["releases"].get(ver, []):
                  if f["packagetype"] == "bdist_wheel" and "py3-none-any" in f["filename"]:
                      wheel_url, wheel_sha = f["url"], f["digests"]["sha256"]
                  elif f["packagetype"] == "sdist" and not sdist_url:
                      sdist_url, sdist_sha = f["url"], f["digests"]["sha256"]
              url = wheel_url or sdist_url
              sha = wheel_sha or sdist_sha
              if not url:
                  return None
              return {
                  "name": pkg_normalized, "deps": deps,
                  "url": url, "sha256": sha,
                  "has_wheel": bool(wheel_url),
              }

          # Resolve e3cli itself from PyPI (the just-uploaded version). Retry until the
          # wheel appears — PyPI's JSON API may lag a few seconds after twine upload.
          self_info = None
          for attempt in range(12):  # 12 × 5s = 60s budget
              self_info = get_info("e3cli", version=e3cli_version)
              if self_info and self_info["has_wheel"]:
                  break
              print(f"PyPI wheel for e3cli {e3cli_version} not ready (attempt {attempt + 1}/12)…", file=sys.stderr)
              time.sleep(5)
          if not self_info:
              sys.exit(f"FATAL: e3cli {e3cli_version} not found on PyPI after retries")
          if not self_info["has_wheel"]:
              print(f"WARNING: no wheel for e3cli {e3cli_version}; formula will use sdist and be slow", file=sys.stderr)

          # Resolve ALL transitive dependencies
          seen = set()
          queue = ["typer", "requests", "rich"]
          resources = []

          while queue:
              pkg = queue.pop(0)
              key = re.sub(r'[-_.]+', '_', pkg).lower()
              if key in seen:
                  continue
              seen.add(key)
              info = get_info(pkg)
              if info is None:
                  print(f"WARNING: Could not resolve {pkg}", file=sys.stderr)
                  continue
              if info["url"]:
                  resources.append(info)
              for d in info["deps"]:
                  dk = re.sub(r'[-_.]+', '_', d).lower()
                  if dk not in seen:
                      queue.append(d)

          # Build formula — main package URL points to PyPI wheel (NOT GitHub source
          # tarball). This avoids brew triggering pip's build-isolation flow on install.
          lines = [
              'class E3cli < Formula',
              '  include Language::Python::Virtualenv',
              '',
              '  desc "NYCU E3 Moodle automation CLI — sync courses, download materials, submit assignments"',
              f'  homepage "https://github.com/{repo}"',
              f'  url "{self_info["url"]}"',
              f'  sha256 "{self_info["sha256"]}"',
              '  license "MIT"',
              '',
              '  depends_on "python@3.12"',
          ]

          for r in resources:
              lines += [
                  '',
                  f'  resource "{r["name"]}" do',
                  f'    url "{r["url"]}"',
                  f'    sha256 "{r["sha256"]}"',
                  '  end',
              ]

          # NOTE on def install: when the main url is a wheel we can't use the
          # default `virtualenv_install_with_resources`:
          #  1. brew extracts the .whl (it's a zip) into a directory, but the
          #     extracted dir has no pyproject.toml/setup.py at the root, so pip
          #     refuses to install it.
          #  2. brew caches the downloaded file with a SHA prefix
          #     (<sha>--e3cli-X.Y.Z-py3-none-any.whl), which has too many `-`
          #     parts for pip's wheel filename parser to accept.
          # Fix: copy `cached_download` to a clean wheel filename in buildpath,
          # then pip_install_and_link that file directly (no extraction needed).
          lines += [
              '',
              '  def install',
              '    venv = virtualenv_create(libexec, "python3.12")',
              '    venv.pip_install resources',
              '    wheel = buildpath/"e3cli-#{version}-py3-none-any.whl"',
              '    cp cached_download, wheel',
              '    venv.pip_install_and_link wheel',
              '  end',
              '',
              '  test do',
              '    assert_match "e3cli", shell_output("#{bin}/e3cli version")',
              '  end',
              'end',
              '',
          ]

          formula = "\n".join(lines)
          with open("homebrew-tap/Formula/e3cli.rb", "w") as f:
              f.write(formula)

          print("=== Generated formula ===")
          print(formula)
          print(f"\nTotal resources: {len(resources)}", file=sys.stderr)
          PYSCRIPT

      - name: Push updated formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/e3cli.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update e3cli to ${{ github.ref_name }}"
          git push
